<!doctype html>
<html lang="en">
  <head>
    <title>The page you were looking for doesn't exist (404 Not found)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Tailwind CDN for standalone static pages -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Raleway', 'sans-serif'],
            },
            colors: {
              periwinkle: {
                DEFAULT: '#685FD6',
                dark: '#4C4682',
                light: '#F0F2FC',
              },
              surface: {
                bg: '#FAFBFD',
                text: '#2D2B4A',
                border: '#EAEFFC',
                subtle: '#E0E3F6',
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
  </head>

  <body class="bg-surface-bg text-surface-text font-sans min-h-screen flex items-center justify-center p-6 m-0 antialiased">

    <main class="max-w-2xl w-full flex flex-col items-center justify-center text-center gap-8 py-10">
      
      <!-- Sewing Scene Composition -->
      <div class="relative w-full max-w-lg py-12 px-6 bg-white border border-surface-border rounded-2xl shadow-[0_4px_20px_rgba(104,95,214,0.05)] flex items-center justify-center gap-3 select-none overflow-hidden">
        
        <!-- Thread Curves Background SVG -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none stroke-current text-surface-subtle overflow-hidden" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 30 140 C 90 200, 120 20, 200 100 C 280 180, 310 10, 370 80" stroke-width="2" stroke-dasharray="4 4" />
          <path d="M 50 40 C 100 10, 250 190, 350 150" stroke-width="1.5" stroke="#E34234" opacity="0.4" />
        </svg>

        <!-- Felt 404 Numbers with Stitches -->
        <div class="relative flex items-center justify-center gap-4 z-10">
          
          <!-- Number 4 -->
          <div class="relative bg-surface-subtle/80 text-periwinkle-dark text-7xl font-black px-6 py-3 rounded-2xl border-2 border-dashed border-white shadow-sm flex items-center justify-center">
            4
            <!-- Chartreuse Sewing Button -->
            <div class="absolute -top-3 -left-3 w-8 h-8 rounded-full bg-[#A3C944] border-2 border-[#82A62D] shadow-md flex items-center justify-center">
              <div class="grid grid-cols-2 gap-0.5">
                <div class="w-1 h-1 rounded-full bg-[#526B13]"></div>
                <div class="w-1 h-1 rounded-full bg-[#526B13]"></div>
                <div class="w-1 h-1 rounded-full bg-[#526B13]"></div>
                <div class="w-1 h-1 rounded-full bg-[#526B13]"></div>
              </div>
            </div>
          </div>

          <!-- Number 0 -->
          <div class="relative bg-surface-subtle/80 text-periwinkle-dark text-7xl font-black px-6 py-3 rounded-2xl border-2 border-dashed border-white shadow-sm flex items-center justify-center">
            0
            <!-- Periwinkle Sewing Button -->
            <div class="absolute -bottom-3 -right-2 w-9 h-9 rounded-full bg-[#685FD6] border-2 border-[#4C4682] shadow-md flex items-center justify-center">
              <div class="grid grid-cols-2 gap-0.5">
                <div class="w-1 h-1 rounded-full bg-[#2D2B4A]"></div>
                <div class="w-1 h-1 rounded-full bg-[#2D2B4A]"></div>
                <div class="w-1 h-1 rounded-full bg-[#2D2B4A]"></div>
                <div class="w-1 h-1 rounded-full bg-[#2D2B4A]"></div>
              </div>
            </div>
          </div>

          <!-- Number 4 -->
          <div class="relative bg-surface-subtle/80 text-periwinkle-dark text-7xl font-black px-6 py-3 rounded-2xl border-2 border-dashed border-white shadow-sm flex items-center justify-center">
            4
            <!-- Vermillion Sewing Button -->
            <div class="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-[#E34234] border-2 border-[#B82B1F] shadow-md flex items-center justify-center">
              <div class="grid grid-cols-2 gap-0.5">
                <div class="w-1 h-1 rounded-full bg-[#5C110A]"></div>
                <div class="w-1 h-1 rounded-full bg-[#5C110A]"></div>
                <div class="w-1 h-1 rounded-full bg-[#5C110A]"></div>
                <div class="w-1 h-1 rounded-full bg-[#5C110A]"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Text Section -->
      <article class="flex flex-col items-center gap-3">
        <h1 class="text-xs font-extrabold uppercase tracking-widest text-periwinkle border border-surface-subtle bg-periwinkle-light px-3 py-1 rounded-full">
          Not Found
        </h1>
        
        <p class="text-base text-periwinkle-dark leading-relaxed max-w-lg mt-2">
          <strong>In each of these wonders I've made just for you</strong><br/> the page you sought couldn't be found for you.
        </p>
      </article>

      <!-- Return Button -->
      <a 
        href="/" 
        class="bg-periwinkle hover:bg-periwinkle-dark text-white font-semibold text-sm px-5 py-2.5 rounded-md transition-colors duration-200 no-underline shadow-sm"
      >
        Return Home
      </a>

    </main>

  </body>
</html>
