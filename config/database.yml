default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 54322) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "rails123") %>
  database: <%= ENV.fetch("DB_NAME", "postgres") %>
  sslmode: disable

development:
  <<: *default

test:
  <<: *default
  database: postgres_test

production:
  primary:
    <<: *default
  cable:
    <<: *default
  cache:
    <<: *default
  queue:
    <<: *default
